name: Deploy

# Läuft nach einem Push auf main, sobald "Validate" erfolgreich war. Ungültige Daten
# oder fehlschlagende Tests lassen Validate scheitern – dann wird nichts veröffentlicht.
# Die Handelsregister-Abfrage startet Deploy direkt per Dispatch: Läufe, die mit
# GITHUB_TOKEN angestossen wurden, lösen kein "workflow_run" aus. Darum prüft Deploy
# in diesem Fall selbst.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prüfen (nur bei Dispatch, sonst hat Validate das schon getan)
        if: github.event_name == 'workflow_dispatch'
        run: npm run validate && npm run typecheck && npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
